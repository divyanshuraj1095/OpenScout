openapi: 3.1.0
info: {title: OpenScout Identity API, version: 1.0.0}
paths:
  /api/v1/auth/csrf:
    get:
      responses:
        '200': {description: Returns token and headerName. Keep the CSRF session cookie.}
  /api/v1/auth/signup:
    post:
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name,email,password]
              properties:
                name: {type: string, maxLength: 100}
                gitHubURL: {type: string, format: uri}
                email: {type: string, format: email}
                password: {type: string, minLength: 12, maxLength: 72}
      responses:
        '201': {description: Profile containing id, name and email}
        '409': {description: Email already registered}
  /api/v1/auth/login:
    post:
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email,password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        '200': {description: Profile and session cookie. Fetch fresh CSRF token.}
        '401': {description: Invalid credentials}
  /api/v1/me:
    get:
      security: [{session: []}]
      responses:
        '200': {description: Authenticated profile}
        '401': {description: Invalid or missing session}
  /api/v1/auth/logout:
    post:
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses:
        '204': {description: Session revoked}
        '403': {description: CSRF rejected}
  /actuator/health:
    get:
      responses:
        '200': {description: Healthy}
        '503': {description: Unhealthy}
  /api/v1/repositories:
    get:
      summary: List member repositories
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      security: [{session: []}]
      responses:
        '200': {description: List member repositories}
    post:
      summary: Import or synchronize public repository
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repoUrl]
              properties:
                repoUrl: {type: string, format: uri}
      responses:
        '201': {description: Import or synchronize public repository}
        '200': {description: Already imported}
  /api/v1/repositories/{id}/refresh:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    post:
      summary: Refresh a member repository
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses:
        '200': {description: Refresh a member repository}
  /api/v1/issues:
    get:
      summary: Filter and paginate accessible issues
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: repositoryId, schema: {type: string}}
        - {in: query, name: label, schema: {type: string}}
        - {in: query, name: language, schema: {type: string}}
        - {in: query, name: difficulty, schema: {type: string}}
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: state, schema: {type: string}}
      security: [{session: []}]
      responses:
        '200': {description: Filter and paginate accessible issues}
  /api/v1/issues/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    get:
      summary: Get accessible issue detail
      security: [{session: []}]
      responses:
        '200': {description: Get accessible issue detail}
  /api/v1/bookmarks:
    get:
      summary: List personal bookmarks
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: repositoryId, schema: {type: string}}
        - {in: query, name: label, schema: {type: string}}
        - {in: query, name: language, schema: {type: string}}
        - {in: query, name: difficulty, schema: {type: string}}
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: state, schema: {type: string}}
      security: [{session: []}]
      responses:
        '200': {description: List personal bookmarks}
  /api/v1/bookmarks/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    put:
      summary: Bookmark accessible issue
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses:
        '204': {description: Bookmark accessible issue}
    delete:
      summary: Remove personal bookmark
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses:
        '204': {description: Remove personal bookmark}
  /api/v1/repositories/{repository}/sample/ingest:
    parameters:
      - {in: path, name: repository, required: true, schema: {type: integer, format: int64}}
    post:
      summary: Embed the bundled Phase 3 sample for a visible member repository
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses:
        '200': {description: Sample chunk count and immutable index version}
        '404': {description: Repository inaccessible}
  /api/v1/repositories/{repository}/sample/questions:
    parameters:
      - {in: path, name: repository, required: true, schema: {type: integer, format: int64}}
    post:
      summary: Answer a question from the bundled sample
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200': {description: Answer with grounded flag, indexVersion and server-validated citations}
        '404': {description: Repository inaccessible}
        '409': {description: Sample index missing}
        '503': {description: Provider unavailable}
  /api/v1/repositories/{repo}/indexes:
    parameters:
      - {in: path, name: repo, required: true, schema: {type: integer, format: int64}}
    post:
      summary: Enqueue or join a shared indexing job
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses:
        '202': {description: Job identifier and authenticated status URL}
  /api/v1/repositories/{repo}/jobs/{id}:
    parameters:
      - {in: path, name: repo, required: true, schema: {type: integer, format: int64}}
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      security: [{session: []}]
      responses:
        '200': {description: State, files processed, manifest total and safe error code}
        '404': {description: Missing or inaccessible job}
  /api/v1/repositories/{repo}/indexes/active/questions:
    parameters:
      - {in: path, name: repo, required: true, schema: {type: integer, format: int64}}
    post:
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200': {description: Answer envelope pinned to the selected active generation}
        '409': {description: Compatible generation unavailable}
components:
  parameters:
    CSRF: {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
  securitySchemes:
    session: {type: apiKey, in: cookie, name: __Host-openscout}
