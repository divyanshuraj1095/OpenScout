spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/openscout_dev
spring.datasource.username=openscout_dev
spring.datasource.password=${OPENSCOUT_DEV_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true
management.endpoints.web.exposure.include=health
app.origin=${OPENSCOUT_ORIGIN:http://localhost:5173}
app.key=${OPENSCOUT_JWT_KEY}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.name=OSC_CSRF_SESSION
server.servlet.session.timeout=30m

spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.ai.model.chat=none
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBED_MODEL:nomic-embed-text}
rag.embedding.provider=${EMBEDDING_PROVIDER:ollama}
rag.embedding.url=${EMBEDDING_URL:https://localhost/v1/embeddings}
rag.embedding.key=${EMBEDDING_API_KEY:}
rag.embedding.model=${EMBEDDING_MODEL:${spring.ai.ollama.embedding.options.model}}
rag.embedding.space=${rag.embedding.provider}/${rag.embedding.model}/${EMBEDDING_REVISION:0a109f422b47e3a30ba2b10eca18548e944e8a23073ee3f3e947efcf3c45e59f}
rag.threshold=${RAG_MIN_SIMILARITY:0.61}
rag.generation.url=${GENERATION_URL:https://api.groq.com/openai/v1/chat/completions}
rag.generation.model=${GENERATION_MODEL:${GROQ_MODEL:llama-3.3-70b-versatile}}
rag.generation.groq.key=${GROQ_API_KEY:}
rag.generation.hosted.key=${GENERATION_API_KEY:}
rag.generation.key=${rag.generation.${rag.generation.provider}.key:}
rag.generation.provider=${GENERATION_PROVIDER:ollama}
rag.generation.ollama-model=${OLLAMA_CHAT_MODEL:qwen2.5:3b}
